spring:

  application:
    name: spring-security-template

  datasource:
    url: jdbc:mysql://localhost:3307/auth_dev
    username: auth
    password: auth

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        dialect.storage_engine: innodb

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

  output:
    ansi:
      enabled: always

server:
  port: 8080