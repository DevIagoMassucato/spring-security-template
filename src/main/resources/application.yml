spring:

  application:
    name: spring-security-template

  datasource:
    url: jdbc:mysql://localhost:3307/auth_dev
    username: auth
    password: auth

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    access-token-expiration: 5m
    refresh-token-expiration: 7d

  output:
    ansi:
      enabled: always

notification:
  url: http://localhost:8086

server:
  port: 8080